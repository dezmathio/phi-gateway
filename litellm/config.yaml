# demo-chat is the only name the app uses. Swap the provider by editing the model line
# under demo-chat (and CHAT_API_BASE / CHAT_API_KEY if the host changes).
# Examples:
#   openai/qwen2.5:0.5b     local Ollama, OpenAI-compatible endpoint
#   openai/gpt-4o-mini      OpenAI
#   anthropic/claude-sonnet-4-5
#   xai/grok-3

model_list:
  - model_name: demo-chat
    litellm_params:
      model: os.environ/CHAT_MODEL
      api_base: os.environ/CHAT_API_BASE
      api_key: os.environ/CHAT_API_KEY
    model_info:
      # Local models are free at the host. These rates exist so the virtual-key
      # spend cap and the log strip move. They are gateway accounting, not a vendor bill.
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
  - model_name: demo-embed
    litellm_params:
      model: os.environ/EMBED_MODEL
      api_base: os.environ/CHAT_API_BASE
      api_key: os.environ/CHAT_API_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  callbacks: custom_callbacks.proxy_handler_instance
  drop_params: true
  request_timeout: 120
  set_verbose: false

guardrails:
  - guardrail_name: presidio-pre-call
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      presidio_language: en
      presidio_filter_scope: input
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
      presidio_ad_hoc_recognizers: ad_hoc_recognizers.json
      presidio_score_thresholds:
        ALL: 0.4
      pii_entities_config:
        PERSON: MASK
        DATE_TIME: MASK
        US_SSN: MASK
        PHONE_NUMBER: MASK
        EMAIL_ADDRESS: MASK
        LOCATION: MASK
        MRN: MASK
        CREDIT_CARD: MASK
        IP_ADDRESS: MASK
        US_PASSPORT: MASK
        US_DRIVER_LICENSE: MASK
        US_BANK_NUMBER: MASK
        IBAN_CODE: MASK
        URL: MASK
        MEDICAL_LICENSE: MASK
        US_STREET_ADDRESS: MASK
